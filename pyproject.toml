[project]
name = "letterboxd-overseerr-sync"
version = "1.0.0"
description = "Sync a Letterboxd watchlist into Overseerr/Jellyseerr/Seerr and/or the Plex watchlist"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "plexapi>=4.15,<5"]

[project.scripts]
letterboxd-sync = "letterboxd_sync.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
